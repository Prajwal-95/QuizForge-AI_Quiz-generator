server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets for faster loads.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long cache for fingerprinted static assets (Vite includes content hash
    # in filenames), short/no-cache for index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: for any non-file request, serve index.html so React's
    # BrowserRouter (including /quiz/<shareCode>) works on refresh/direct link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the FastAPI backend service.
    # By default this proxies to the backend service name used within a
    # single Render blueprint network. If you run the frontend and backend
    # as separate standalone web services on Render, replace
    # "quizforge-backend:8001" with your published backend URL, e.g.
    #   proxy_pass https://quizforge-backend.onrender.com;
    location /api/ {
        proxy_pass http://quizforge-backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
