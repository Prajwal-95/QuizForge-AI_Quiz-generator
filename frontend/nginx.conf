server {
    # Render injects the PORT env var (default 10000 for web services).
    # envsubst in the Dockerfile CMD resolves ${PORT} at container start.
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets for faster loads.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API proxy ──────────────────────────────────────────────────
    # Forward /api/ requests to the FastAPI backend.  This is the
    # primary way the frontend reaches the API — whether VITE_API_BASE
    # was baked into the bundle or not.
    #
    # API_BACKEND is a runtime env var (e.g. "quizforge-api-ntm4.onrender.com")
    # set via render.yaml → fromService.  Without it, requests fall through
    # to the SPA fallback below (which returns HTML, not JSON).
    location /api/ {
        proxy_pass https://${API_BACKEND}$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host ${API_BACKEND};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Long cache for fingerprinted static assets (Vite includes content hash
    # in filenames), short/no-cache for index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback: for any non-file request, serve index.html so React's
    # BrowserRouter (including /quiz/<shareCode>) works on refresh/direct link.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
