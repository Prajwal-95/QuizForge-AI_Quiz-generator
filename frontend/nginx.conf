server {
    # Render injects the PORT env var (default 10000 for web services).
    # envsubst in the Dockerfile CMD resolves ${PORT} at container start.
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets for faster loads.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long cache for fingerprinted static assets (Vite includes content hash
    # in filenames), short/no-cache for index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: for any non-file request, serve index.html so React's
    # BrowserRouter (including /quiz/<shareCode>) works on refresh/direct link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # NOTE: API calls are NOT proxied here. The Vite bundle is built with
    # VITE_API_BASE pointing directly at the backend's public URL
    # (https://quizforge-api.onrender.com) at build time, and CORS is wide open
    # on the backend, so the frontend talks to the FastAPI service cross-origin.
    # Remove the VITE_API_BASE env var to fall back to this same-origin proxy.
}
