# QuizForge AI — Render Blueprint
# Deploy the whole app (backend + frontend) with ONE click:
#   1. Push this repo to GitHub
#   2. Render -> New -> Blueprint -> connect the repo -> Apply
# Free tier works for both services.
#
# ⚠️  FREE-TIER LIMITATION: Render free tier does NOT support persistent disks.
# On free tier the SQLite DB lives in the container's ephemeral filesystem and
# is WIPED on every cold start / redeploy.  Accounts and quizzes will not
# survive restarts.
#
# To keep data across restarts you MUST upgrade to a paid plan and enable the
# disk block below (uncomment the `disk:` section and change DATABASE_URL back
# to  sqlite:////var/data/quizforge.db).  See DEPLOY.md for full instructions.

services:
  # ── Backend: FastAPI (Python, Docker) ────────────────────────
  - type: web
    name: quizforge-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    # ── Persistent disk (paid plan only) ─────────────────────────
    # Uncomment the block below after upgrading to a paid Render plan.
    # On free tier, omitting this lets the Blueprint sync succeed.
    #
    # disk:
    #   name: quizforge-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        # Free tier: store in working directory (ephemeral — data lost on restart).
        # Paid plan with disk: change to  sqlite:////var/data/quizforge.db
        value: sqlite:///./quizforge.db
      - key: GOOGLE_CLIENT_ID
        # For Sign in with Google (see README). Leave blank to hide the button.
        sync: false
      - key: GROQ_API_KEY
        # REQUIRED for live AI quizzes. Without a key the app stays in Demo Mode
        # (curated local question bank) and the UI shows "Demo mode". Grab a free
        # key at console.groq.com, then set it here in the dashboard:
        #   quizforge-api -> Environment -> GROQ_API_KEY -> Save (auto-redeploys)
        sync: false

  # ── Frontend: React (Vite build + nginx, Docker) ─────────────
  - type: web
    name: quizforge
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # Injected at Docker build time via ARG in the Dockerfile.
      # Render resolves this from the backend service's public hostname,
      # then api.ts auto-adds /api at runtime.
      #
      # Use RENDER_EXTERNAL_HOSTNAME (not `property: host`): Render's `host`
      # property returns the TRUNCATED internal host (e.g. "quizforge-api-ntm4"
      # WITHOUT ".onrender.com"), which produces a bundle that calls
      # "https://quizforge-api-ntm4/api" → DNS fails → permanent "Offline" badge.
      # RENDER_EXTERNAL_HOSTNAME is the full public hostname
      # (e.g. "quizforge-api-ntm4.onrender.com").
      - key: VITE_API_BASE
        fromService:
          name: quizforge-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      # Runtime-only: used by nginx.conf (via envsubst) to proxy /api/ to the
      # backend.  This is the PRIMARY way the frontend reaches the API — even
      # if VITE_API_BASE wasn't baked into the bundle at build time.
      - key: API_BACKEND
        fromService:
          name: quizforge-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: VITE_GOOGLE_CLIENT_ID
        # Must equal the backend GOOGLE_CLIENT_ID. Sets the button visibility.
        sync: false