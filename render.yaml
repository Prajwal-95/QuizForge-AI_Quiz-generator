# QuizForge AI — Render Blueprint
# Deploy the whole app (backend + frontend) with ONE click:
#   1. Push this repo to GitHub
#   2. Render -> New -> Blueprint -> connect the repo -> Apply
# Free tier works for both services.

services:
  # ── Backend: FastAPI (Python, Docker) ────────────────────────
  - type: web
    name: quizforge-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./quizforge.db
      - key: GROQ_API_KEY
        sync: false # set later in the dashboard if you use Groq LLM mode

  # ── Frontend: React (Vite build + nginx, Docker) ─────────────
  - type: web
    name: quizforge
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # Injected at Docker build time via ARG in the Dockerfile.
      # Render resolves this from the backend service's public hostname,
      # then api.ts auto-adds /api at runtime.
      - key: VITE_API_BASE
        fromService:
          name: quizforge-api
          type: web
          property: host